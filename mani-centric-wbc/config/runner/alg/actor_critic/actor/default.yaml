_target_: torch.nn.Sequential
# 三层mlp，128-64-32
_args_:
  - _target_: torch.nn.Linear
    in_features: ${....num_actor_obs} # actor的观测
    out_features: 128
  - _target_: torch.nn.ELU
  - _target_: torch.nn.Linear
    in_features: 128
    out_features: 64
  - _target_: torch.nn.ELU
  - _target_: torch.nn.Linear
    in_features: 64
    out_features: 32
  - _target_: torch.nn.ELU
  - _target_: torch.nn.Linear
    in_features: 32
    out_features: ${....num_actions} # 18 dof action